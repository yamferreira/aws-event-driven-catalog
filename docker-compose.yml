version: '3.8'

services:
  app:
    build: .
    container_name: aws-event-driven-catalog
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/product-catalog
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-2
      AWS_ENDPOINT_URL: http://localstack:4566
    depends_on:
      mongo:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - catalog-net

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - catalog-net

  localstack:
    image: localstack/localstack:3
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs,s3
      DEFAULT_REGION: us-east-2
    volumes:
      - ./init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - catalog-net

networks:
  catalog-net:
    driver: bridge

volumes:
  mongo-data:
  localstack-data: